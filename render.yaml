services:
  - type: web
    name: ona-tili-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python test_bot.py
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: USE_WEBHOOK
        value: "1"
      - key: ADMIN_ID
        value: "8039427064"
      - key: BOT_USERNAME
        value: demo_rashonatili_bot
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: "8082"
      - key: PG_POOL_MINCONN
        value: "1"
      - key: PG_POOL_MAXCONN
        value: "25"
      - key: WEBAPP_URL
        value: https://ona-tili-bot.onrender.com
